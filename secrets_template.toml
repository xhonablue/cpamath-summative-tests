# Copy everything below into Streamlit Cloud -> your app -> Settings -> Secrets.
# NEVER commit a real secrets.toml to GitHub (it is git-ignored).

app_url = "https://cpamath-summative-tests.streamlit.app/"

# ---- Access (PINs are the fallback when Google sign-in isn't set up) ----
teacher_pin = "choose-a-real-pin"
admin_pin   = "choose-a-different-pin"

# With Google sign-in on, these emails get access instead of the PINs:
teacher_emails = ["honablue@YOUR-SCHOOL-DOMAIN"]
admin_emails   = ["principal@YOUR-SCHOOL-DOMAIN"]
student_email_domain = "YOUR-STUDENT-DOMAIN"   # e.g. students.cpa.org (optional)

allow_retakes = false

# ---- REQUIRED: private results Google Sheet ----
sheet_id = "PASTE-SHEET-ID"

[gcp_service_account]
type = "service_account"
project_id = ""
private_key_id = ""
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = ""
client_id = ""
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = ""
universe_domain = "googleapis.com"

# ---- OPTIONAL: Google Classroom API sync (needs Workspace admin approval) ----
# classroom_delegated_user = "honablue@YOUR-SCHOOL-DOMAIN"

# ---- RECOMMENDED: "Sign in with Google" for students & staff ----
[auth]
redirect_uri = "https://cpamath-summative-tests.streamlit.app/oauth2callback"
cookie_secret = "LONG-RANDOM-STRING"
client_id = "PASTE-OAUTH-CLIENT-ID.apps.googleusercontent.com"
client_secret = "PASTE-OAUTH-CLIENT-SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
